# Check, build and (on main) deploy to GitHub Pages.
# Spec: portfolio/docs/02-tech-spec.md §13; milestone M0.
name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:pinned
      - run: npm run check:no-array-ui
      - run: npm run check:resume
      - run: npm run check:employer
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check:built
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:blog
      - run: npm run lighthouse
      # The deployed build is the only one with analytics (tech spec §10, decision 0012).
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: ANALYTICS=1 npm run build && node scripts/check-site.mjs analytics dist present
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            .lighthouseci-report/
          retention-days: 7
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
